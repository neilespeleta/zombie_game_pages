<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zombies: Dead Zone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url("background1.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 640px;
      background: rgba(0,0,0,0.6);
      padding: 2rem;
      border-radius: 16px;
      backdrop-filter: blur(4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    a {
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    /* =========================
   📱 MOBILE OPTIMIZATION
========================= */
@media (max-width: 768px) {

  body {
    background-attachment: scroll;
    padding: 1rem;
  }

  .container {
    max-width: 100%;
    padding: 1.4rem;
    border-radius: 12px;
    backdrop-filter: blur(3px);
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 0.8rem;
  }

  p {
    font-size: 1rem;
    line-height: 1.5;
  }

  a {
    font-size: 1.05rem;
  }
}

  </style>
</head>

<body>
  <div class="container">
    <h1>Zombies: Dead Zone</h1>

    <p>
      Zombies: Dead Zone is a fast-paced mobile survival game where players
      fight waves of zombies in a hostile environment.
    </p>

    <p>Available on Android.</p>

    <p>
      <a href="privacy.html">Privacy Policy</a> |
      <a href="support.html">Support</a>
    </p>
  </div>
</body>
</html>
